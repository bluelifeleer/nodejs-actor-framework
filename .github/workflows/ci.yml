# CI 门禁：跑的是**开发者本地同一条命令** `npm run ci`（typecheck + 全量测试 + 文档站构建）。
# 单一事实来源的好处：不会出现"CI 绿、本地红"（或反过来）——两者执行的东西不一样。
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 超时 40 分钟：全量测试是 `--test-concurrency=1` 串行（本地 M 系列 Mac 约 18 分钟），
# 共享 runner 更慢，20 分钟会顶到线 —— 宁可给足，也不要让"超时"伪装成"测试失败"。
#
# 同一分支上新的推送取消旧的运行（省额度，也避免排队等很久）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 与 package.json 的 engines 一致：源码直接跑 TypeScript 且用了 node:sqlite，
          # Node 20/22 起不来（详见 README 的"环境要求"）。
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: typecheck + 全量测试 + 文档站（含断链门禁）
        run: npm run ci
