// Reference schema for the Actor Framework wire protocols.
//
// THIS FILE IS DOCUMENTATION ONLY. It is not compiled and the project has no
// protobuf dependency: proto.js implements just enough of the protobuf wire
// format (varints, length-delimited fields, unknown-field skipping).
//
// Both binary transports (framing.js) share one frame layout:
//
//   uint32_be bodyLength | uint8 codec | body
//   codec 0 = JSON (utf-8 JSON of the message below)
//   codec 1 = Protocol Buffers (the message below)
//
// The codec byte is part of every frame, so a node accepts both encodings and
// mixed peers interoperate without negotiation.
//
// Field numbers are append-only: new fields get the next free number and old
// numbers are never reused or renumbered (decoders skip unknown fields, which is
// what makes rolling upgrades work). Keep this file in sync with proto.ts — it
// drifted once (this schema used to stop at field 9 while proto.ts was at 14),
// and a stale schema is worse than none because people copy field numbers from it.

syntax = "proto3";

package actorfw;

// ---------------------------------------------------------------------------
// TCP gateway frames (gateway.js / proto.js)
// ---------------------------------------------------------------------------
message GatewayFrame {
  string kind = 1;          // "hello" | "ping" | "pong" | "deliver" | "result" | "error"
  string id = 2;            // correlation id; the response echoes it back
  string nodeId = 3;        // responder identity (checked against the TLS cert CN)
  uint64 ts = 4;            // pong timestamp (ms)
  string targetActorId = 5; // deliver: recipient on the peer node
  bytes payloadJson = 6;    // deliver: utf-8 JSON of the actor payload
  bool ok = 7;              // result: success flag
  string error = 8;         // result/error: failure description
  bytes dataJson = 9;       // result: utf-8 JSON of the actor's reply
  uint64 timeoutMs = 10;    // deliver: caller's timeout, so a remote call keeps local semantics
  string senderPath = 11;   // deliver: who is asking (so the callee can reply)
  bytes traceJson = 12;     // deliver: utf-8 JSON of the trace context
  string senderHost = 13;   // deliver: sender's gateway host (reply without waiting for gossip)
  uint64 senderPort = 14;   // deliver: sender's gateway port
  uint64 shardEpoch = 15;   // fencing token: which generation owns the target's shard (optional)
  bytes capsJson = 16;      // hello: utf-8 JSON array of capability names, e.g. ["fence"]
  uint64 shardCount = 17;   // hello: the sender's shard count (mismatch => refuse the connection)
}

// Actor payloads are JSON objects with a `type` discriminator plus arbitrary
// business fields, which is why they travel as JSON bytes rather than as a
// typed protobuf message. The framework-owned keys are:
message ActorPayload {
  string type = 1;          // business message type, e.g. "hurt", "debug:getState"
  uint32 priority = 2;      // 0 = HIGH, 1 = NORMAL, 2 = LOW (invalid -> NORMAL)
  string topic = 3;         // set by PubSub on delivery
  TraceContext trace = 4;   // distributed tracing context
}

message TraceContext {
  string traceId = 1;
  string spanId = 2;
  string parentSpanId = 3;  // empty for a root span
  bool sampled = 4;
}

// Business example used by the built-in handler and the console.
message HurtPayload {
  string type = 1;          // "hurt"
  double damage = 2;        // must be finite; non-numeric values are rejected
}

// Control channel (ActorManager.control), JSON-only today.
message ControlRequest {
  string type = 1;          // "hot_reload" | "hot_reload_module" | "monitor:watch" |
                            // "monitor:unwatch" | "debug:ping" | "debug:stats" | "actor:shutdown"
  string ctlId = 2;
  string fnCode = 3;        // hot_reload
  string modulePath = 4;    // hot_reload_module
  string exportName = 5;    // hot_reload_module
  string watcherActorId = 6; // monitor:*
}

message ControlReply {
  string ctlId = 1;
  bool ok = 2;
  bytes dataJson = 3;
  string error = 4;
}

// ---------------------------------------------------------------------------
// Gossip (gossip.js), inside the same framed transport (codec 1 by default)
// ---------------------------------------------------------------------------
message GossipEnvelope {
  string type = 1;           // "gossip"
  string sender = 2;         // origin node id (checked against the TLS cert CN)
  string advertiseHost = 3;  // address peers should dial back on
  uint32 port = 4;           // origin gossip port
  bytes dataJson = 5;        // utf-8 JSON of the replicated registry map below
}

// The registry map travels as JSON bytes because its values are heterogeneous:
// actor metadata (RegistryValue) and subscription sets keyed as "subs:<nodeId>".
message RegistryEntry {
  string key = 1;            // actor id, or "subs:<nodeId>" for subscriptions
  RegistryValue value = 2;
  uint64 ts = 3;             // last-write-wins timestamp (ms)
  string nodeId = 4;         // author; breaks ties at equal ts
  bool deleted = 5;          // tombstone
}

message RegistryValue {
  string nodeId = 1;
  string type = 2;           // "actor"
  string actorId = 3;
  string host = 4;           // gateway host
  uint32 gatewayPort = 5;    // gateway port to reach this actor
}
