# 本地/CI 用的数据库（供 `npm test` 的真库用例）：端口刻意避开默认值，避免和本机已装的库打架。
# 用法：node scripts/dev-databases.mjs up   （然后 eval "$(node scripts/dev-databases.mjs env)"）
services:
  pg:
    image: postgres:16
    environment:
      POSTGRES_USER: actor
      POSTGRES_PASSWORD: actor
      POSTGRES_DB: actor
    ports:
      - '55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U actor -d actor']
      interval: 2s
      timeout: 2s
      retries: 40

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: actor
      MYSQL_USER: actor
      MYSQL_PASSWORD: actor
      MYSQL_DATABASE: actor
    ports:
      - '53306:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uactor', '-pactor']
      interval: 2s
      timeout: 2s
      retries: 60

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: 'Act0rPassw0rd1'
      MSSQL_PID: Developer
    ports:
      - '51433:1433'
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b
      interval: 5s
      timeout: 5s
      retries: 60

  redis:
    image: redis:7
    ports:
      - '56379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 40

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: actor
      MONGO_INITDB_ROOT_PASSWORD: actor
    ports:
      - '57017:27017'
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.runCommand({ ping: 1 })']
      interval: 3s
      timeout: 5s
      retries: 60
